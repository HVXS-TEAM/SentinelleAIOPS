<form class="w-full space-y-6">
<div class="space-y-2">
  <label class="block font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider" for="profile-select">PROFILS</label>
  <div class="relative input-glow transition-all duration-300 rounded border border-outline-variant bg-surface-container-highest">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <span class="material-symbols-outlined text-on-surface-variant text-sm">account_circle</span>
    </div>
    <select class="block w-full pl-10 pr-3 py-2 bg-transparent border-none text-on-surface font-body-md focus:ring-0 appearance-none cursor-pointer" id="profile-select" name="profile">
      <option value="admin" class="bg-surface-container-highest text-on-surface">Administrateur</option>
      <option value="tech" class="bg-surface-container-highest text-on-surface">Technicien</option>
      <option value="visitor" class="bg-surface-container-highest text-on-surface">Visiteur</option>
    </select>
    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
      <span class="material-symbols-outlined text-on-surface-variant text-sm">expand_more</span>
    </div>
  </div>
</div><div class="space-y-2">
<label class="block font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider" for="username">Identifiant</label>
<div class="relative input-glow transition-all duration-300 rounded border border-outline-variant bg-surface-container-highest">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-sm">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 bg-transparent border-none text-on-surface font-body-md placeholder-on-surface-variant/50 focus:ring-0" id="username" name="username" placeholder="admin_aiops" type="text">
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label-mono text-label-mono text-on-surface-variant uppercase tracking-wider" for="password">Mot de passe</label>
<a class="font-label-mono text-label-mono text-primary hover:text-primary-fixed transition-colors" href="#">Oublié ?</a>
</div>
<div class="relative input-glow transition-all duration-300 rounded border border-outline-variant bg-surface-container-highest">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-sm">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 bg-transparent border-none text-on-surface font-body-md placeholder-on-surface-variant/50 focus:ring-0" id="password" name="password" placeholder="••••••••" type="password">
</div>
</div>
