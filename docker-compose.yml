version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: sentinelle_db
    environment:
      POSTGRES_DB: sentinelle_aiops
      POSTGRES_USER: sentinelle_user
      POSTGRES_PASSWORD: SentinelleDBPass2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelle_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://sentinelle_user:SentinelleDBPass2026!@database:5432/sentinelle_aiops
      - SECRET_KEY=sentinelle_aiops_super_secret_key_change_in_production_2026
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - database
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelle_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
